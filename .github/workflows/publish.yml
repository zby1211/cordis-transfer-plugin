name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Build tarball
        run: |
          mkdir -p dist
          npm pack --pack-destination ./dist

      - name: Publish to npm
        id: npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "cordis-transfer-plugin@${VERSION}" version >/dev/null 2>&1; then
            echo "Version ${VERSION} already exists on npm; skipping publish."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
          else
            npm publish ./dist/cordis-transfer-plugin-*.tgz --access public --provenance
            echo "skipped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.CORDIS_GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} exists; uploading asset."
            gh release upload "${GITHUB_REF_NAME}" dist/cordis-transfer-plugin-*.tgz --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              dist/cordis-transfer-plugin-*.tgz \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes
          fi
