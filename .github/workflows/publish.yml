name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      - name: Build tarball
        run: |
          mkdir -p dist
          npm pack --pack-destination ./dist

      - name: Verify npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CORDIS_NPM_TOKEN }}
        run: npm whoami

      - name: Publish to npm
        run: npm publish ./dist/cordis-transfer-plugin-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.CORDIS_NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.CORDIS_GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/cordis-transfer-plugin-*.tgz \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
